<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Devanand Farkade | Full Stack Developer & Java Specialist Portfolio. Specializing in React.js, Node.js, Express, Spring Boot, and PostgreSQL architectures." />
    <meta name="keywords" content="Devanand Farkade, Full Stack Developer, MERN Stack, Java Developer, Pune, Software Engineer, Portfolio, 3D Web Design" />
    <meta name="author" content="Devanand Farkade" />
    <title>Devanand Farkade | Full Stack Developer Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>
  <body class="bg-black select-none">
    <div id="root">
      <!-- Cyber Loading Preloader (Replaced by React once mounted) -->
      <style>
        .site-loader {
          position: fixed;
          inset: 0;
          background-color: #020308;
          color: #39ff14;
          font-family: "Courier New", Courier, monospace;
          display: flex;
          flex-direction: column;
          justify-content: space-between;
          padding: 30px;
          z-index: 9999;
          overflow: hidden;
        }
        .site-loader::after {
          content: "";
          position: absolute;
          inset: 0;
          background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
          background-size: 100% 3px, 3px 100%;
          pointer-events: none;
        }
        .site-loader-header {
          display: flex;
          justify-content: space-between;
          border-bottom: 1px solid rgba(0, 229, 255, 0.2);
          padding-bottom: 15px;
        }
        .site-loader-title {
          font-size: 14px;
          letter-spacing: 2px;
          text-transform: uppercase;
          animation: loaderPulse 1.5s infinite;
        }
        .site-loader-terminal {
          margin: auto 0;
          display: flex;
          flex-direction: column;
          gap: 12px;
        }
        .site-loader-log {
          font-size: 12px;
          opacity: 0.8;
          text-align: left;
        }
        .site-loader-log span {
          color: #00e5ff;
        }
        .site-loader-footer {
          display: flex;
          justify-content: space-between;
          border-top: 1px solid rgba(0, 229, 255, 0.2);
          padding-top: 15px;
          font-size: 10px;
          opacity: 0.5;
        }
        .loading-bar {
          height: 2px;
          background: #39ff14;
          width: 0%;
          box-shadow: 0 0 8px #39ff14;
          animation: loaderBarAnimate 2.5s infinite linear;
        }
        @keyframes loaderPulse {
          0%, 100% { opacity: 0.6; }
          50% { opacity: 1; }
        }
        @keyframes loaderBarAnimate {
          0% { width: 0%; }
          50% { width: 70%; }
          100% { width: 100%; }
        }
      </style>
      <div class="site-loader">
        <div class="site-loader-header">
          <div class="site-loader-title">&lt;DEVA_CORE_INITIALIZE /&gt;</div>
          <div style="font-size: 10px; opacity: 0.6;">SYS_BOOT_v1.0.4</div>
        </div>
        <div class="site-loader-terminal">
          <div class="site-loader-log">&gt; CONNECTING SECURE NETWORK PIPELINES... <span>[OK]</span></div>
          <div class="site-loader-log">&gt; PARSING GRAPHICS SUB-CORE SHADERS... <span>[PENDING]</span></div>
          <div class="site-loader-log">&gt; ALLOCATING BUFFER MEMORY BLOCKS... <span>[24.8 MB]</span></div>
          <div class="site-loader-log" style="font-weight: bold;">&gt; INITIALIZING 3D ENVIRONMENT CANVAS...</div>
          <div style="width: 200px; border: 1px solid rgba(57, 255, 20, 0.3); height: 6px; padding: 1px; border-radius: 3px; margin-top: 5px;">
            <div class="loading-bar"></div>
          </div>
        </div>
        <div class="site-loader-footer">
          <div>MEM_ALLOC: SECURE</div>
          <div>ESTABLISHING ENCRYPTED LINK</div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
